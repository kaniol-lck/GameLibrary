name: CI

on:
  push:
    branches:
      - '**'
    tags-ignore:
      - 'v*'
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  backend:
    name: Backend (Go)
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Install Linux build deps
        run: |
          sudo apt-get update
          sudo apt-get install -y libgtk-3-dev libwebkit2gtk-4.0-dev

      - name: Provide an embedded frontend directory
        # main.go embeds frontend/dist, which is build output and therefore absent
        # from a fresh checkout; //go:embed fails outright when nothing matches.
        # The real bundle is produced by the frontend job and by the release
        # workflow, so a placeholder is enough for compiling and testing here.
        run: mkdir -p frontend/dist && touch frontend/dist/.gitkeep

      - name: Verify gofmt
        run: |
          unformatted="$(gofmt -l $(git ls-files '*.go'))"
          if [ -n "$unformatted" ]; then
            echo "::error::These Go files are not gofmt-formatted:"
            echo "$unformatted"
            exit 1
          fi

      - name: go vet
        # Explicit patterns: ./... would also descend into frontend/node_modules,
        # which happens to contain an unrelated Go package.
        run: go vet ./internal/... .

      - name: Build
        run: go build ./internal/... .

      - name: Test (race detector)
        run: go test -race -count=1 ./internal/... .

      - name: Test coverage
        run: go test -count=1 -coverprofile=coverage.out -covermode=atomic ./internal/... .

      - name: Coverage summary
        run: go tool cover -func=coverage.out | tail -n 1

      - name: Upload coverage artifact
        uses: actions/upload-artifact@v4
        with:
          name: go-coverage
          path: coverage.out
          if-no-files-found: error

  # The shipping platform, so it gets its own job.
  #
  # Tests carry Windows-only branches — drive letters, backslash separators,
  # registry lookups — that the Linux job never executes, and a failure there used
  # to surface only when a release tag was pushed. The race detector is skipped
  # here because it needs cgo and a C compiler the runner does not reliably have;
  # the Linux job covers that.
  backend-windows:
    name: Backend (Go, Windows)
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Provide an embedded frontend directory
        shell: pwsh
        # main.go embeds frontend/dist, which is build output and therefore absent
        # from a fresh checkout; //go:embed fails outright when nothing matches.
        run: |
          New-Item -ItemType Directory -Path frontend/dist -Force | Out-Null
          New-Item -ItemType File -Path frontend/dist/.gitkeep -Force | Out-Null

      - name: gofmt
        shell: pwsh
        run: |
          $files = git ls-files '*.go'
          $unformatted = gofmt -l $files
          if ($unformatted) {
            Write-Output "::error::These Go files are not gofmt-formatted:"
            Write-Output $unformatted
            exit 1
          }

      - name: go vet
        shell: pwsh
        run: go vet ./internal/... .

      - name: Test
        shell: pwsh
        # A failed test run is published as the job summary so it can be read back
        # from the API without authenticated log access.
        run: |
          go test -count=1 ./internal/... . 2>&1 | Tee-Object -FilePath go-test.log
          $code = $LASTEXITCODE
          if ($code -ne 0) {
            "### Go test failures" | Add-Content -Path $env:GITHUB_STEP_SUMMARY
            '```' | Add-Content -Path $env:GITHUB_STEP_SUMMARY
            Get-Content go-test.log | Select-Object -First 300 | ForEach-Object {
              Add-Content -Path $env:GITHUB_STEP_SUMMARY -Value $_
            }
            '```' | Add-Content -Path $env:GITHUB_STEP_SUMMARY
          }
          exit $code

  frontend:
    name: Frontend (React)
    runs-on: ubuntu-22.04
    defaults:
      run:
        working-directory: frontend
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version-file: frontend/.nvmrc
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Format check
        run: npm run format:check

      - name: Typecheck
        run: npm run typecheck

      - name: Test
        run: npm run test

      - name: Build
        run: npm run build
