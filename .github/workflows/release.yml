name: Build and Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build:
    name: Windows build
    # The application targets Windows: the scanner, the launcher and the shell
    # integration are Windows-specific by design. Other platforms still compile
    # and are covered by the CI workflow, but are not shipped.
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version-file: frontend/.nvmrc
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install Wails CLI
        run: go install github.com/wailsapp/wails/v2/cmd/wails@latest

      - name: Set version
        shell: bash
        run: echo "VERSION=${GITHUB_REF_NAME#v}" >> $GITHUB_ENV

      - name: Provide an embedded frontend directory
        shell: bash
        # The test step compiles package main, which embeds frontend/dist. That
        # directory is build output, so it does not exist until `wails build` runs
        # further down; a placeholder keeps the compile step working.
        run: mkdir -p frontend/dist && touch frontend/dist/.gitkeep

      - name: Test
        shell: pwsh
        # A failed test run is published as the job summary so it can be read back
        # from the API without authenticated log access.
        run: |
          go test -count=1 ./internal/... . 2>&1 | Tee-Object -FilePath go-test.log
          $code = $LASTEXITCODE
          if ($code -ne 0) {
            "### Go test failures" | Add-Content -Path $env:GITHUB_STEP_SUMMARY
            '```' | Add-Content -Path $env:GITHUB_STEP_SUMMARY
            Get-Content go-test.log | Select-Object -First 300 | ForEach-Object {
              Add-Content -Path $env:GITHUB_STEP_SUMMARY -Value $_
            }
            '```' | Add-Content -Path $env:GITHUB_STEP_SUMMARY
          }
          exit $code

      - name: Build
        shell: bash
        run: |
          export PATH="$HOME/go/bin:$PATH"
          wails build -platform windows/amd64 \
            -ldflags="-X main.version=$VERSION -X main.buildTime=$(date -u +%Y-%m-%dT%H:%M:%SZ)" \
            -clean

      - name: Prepare assets
        shell: bash
        run: |
          BIN="build/bin/GameLibrary.exe"
          ASSET="GameLibrary-windows-amd64.exe"
          cp "$BIN" "$ASSET"
          sha256sum "$ASSET" > "${ASSET}.sha256"
          echo "ASSET=$ASSET" >> $GITHUB_ENV

      - name: Upload to Release
        uses: softprops/action-gh-release@v2
        with:
          name: GameLibrary ${{ github.ref_name }}
          body_path: .github/RELEASE_TEMPLATE.md
          files: |
            ${{ env.ASSET }}
            ${{ env.ASSET }}.sha256
            scripts/run-with-console.cmd
            CHANGELOG.md
            LICENSE
          generate_release_notes: true
          # Only pre-release versions are marked as such, matching the versioning
          # convention: an -alpha suffix means work in progress, anything else is a
          # release people are expected to run.
          prerelease: ${{ contains(github.ref_name, '-alpha') }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
